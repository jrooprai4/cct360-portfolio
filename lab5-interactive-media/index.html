<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 5 - Interactive Media</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <dialog id="enter">
        <div id="dialog-div">
            <h3>Lab 5 - Interactive Media</h3>
            <p>Click here to enter</p>
        </div>
    </dialog>

    <p>Control the background audio here:</p>
    <audio id="audio" autoplay controls loop src="audio/bird-park-ambience.mp3" type="audio/mp3">
        <!-- source for this audio is in sources.md -->
        This broswer does not support this audio :(
    </audio>

    <hr>

    <h2>My Calgary Trip - A Small Gallery</h2>
    <div id="scroll-container">
        <div class="scroll-item">
            <img src="images/IMG_9164.jpg" alt="emerald lake" width="300">
            <!-- this is my image -->
        </div>
        <div class="scroll-item">
            <video id="vid1" src="videos/IMG_9168.mp4" type="video/mp4" height="400">
                <!-- this is my video -->
                This broswer does not support this video :(
            </video>

            <button id="play1">Play</button>
            <button id="pause1">Pause</button>
            <button id="reset1">Reset</button>
        </div>
        <div class="scroll-item">
            <img src="images/IMG_9231.jpg" alt="banff" height="400">
            <!-- this is my image -->
        </div>
        <div class="scroll-item">
            <video id="vid2" src="videos/IMG_9224.mp4" type="video/mp4" height="400">
                <!-- this is my video -->
                This broswer does not support this video :(
            </video>

            <button id="play2">Play</button>
            <button id="pause2">Pause</button>
            <button id="reset2">Reset</button>
        </div>
        <div class="scroll-item">
            <img src="images/IMG_9259.jpg" alt="sunshine village" height="400">
            <!-- this is my image -->
        </div>
        <div class="scroll-item">
            <video id="vid3" src="videos/IMG_9397.mp4" type="video/mp4" height="400">
                <!-- this is my video -->
                This broswer does not support this video :(
            </video>

            <button id="play3">Play</button>
            <button id="pause3">Pause</button>
            <button id="reset3">Reset</button>
        </div>
        <div class="scroll-item">
            <img src="images/IMG_9330.jpg" alt="calgary public library" width="300">
            <!-- this is my image -->
        </div>
    </div>


    <script src="script.js"></script>
</body>
</html>
