<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 5 - Interactive Media</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <dialog id="enter">
        <div id="dialog-div">
            <h3>Lab 5 - Interactive Media</h3>
            <p>Click here to enter</p>
        </div>
    </dialog>

    <h1>My Calgary Trip - A Small Gallery</h1>
    <div id="scroll-container">
        <div class="scroll-item pics">
            <img src="images/IMG_9164.jpg" alt="emerald lake" width="300">
            <!-- this is my image -->
        </div>
        <div class="scroll-item vid-container">
            <video class="videos" src="https://github.com/jrooprai4/cct360-portfolio/raw/295edd8f04a2fe7483a0efa943fd0faf8cb34807/lab5-interactive-media/videos/IMG_9168.mp4" type="video/mp4" height="400">
                <!-- this is my video -->
                This broswer does not support this video :(
            </video>
            <div class="controls-row">
                <input type="range" class="progress-slider" min="0" max="100" value="0">
                <span class="time-display">00:00 / 00:00</span>
                <button class="play">Play</button>
                <button class="reset">Reset</button>
            </div>
        </div>
        <div class="scroll-item pics">
            <img src="images/IMG_9231.jpg" alt="banff" height="400">
            <!-- this is my image -->
        </div>
        <div class="scroll-item vid-container">
            <video class="videos" src="https://github.com/jrooprai4/cct360-portfolio/raw/295edd8f04a2fe7483a0efa943fd0faf8cb34807/lab5-interactive-media/videos/IMG_9224.mp4" type="video/mp4" height="400">
                <!-- this is my video -->
                This broswer does not support this video :(
            </video>
            <div class="controls-row">
                <input type="range" class="progress-slider" min="0" max="100" value="0">
                <span class="time-display">00:00 / 00:00</span>
                <button class="play">Play</button>
                <button class="reset">Reset</button>
            </div>
        </div>
        <div class="scroll-item pics">
            <img src="images/IMG_9259.jpg" alt="sunshine village" height="400">
            <!-- this is my image -->
        </div>
        <div class="scroll-item vid-container">
            <video class="videos" src="https://github.com/jrooprai4/cct360-portfolio/raw/295edd8f04a2fe7483a0efa943fd0faf8cb34807/lab5-interactive-media/videos/IMG_9397.mp4" type="video/mp4" height="400">
                <!-- this is my video -->
                This broswer does not support this video :(
            </video>
            <div class="controls-row">
                <input type="range" class="progress-slider" min="0" max="100" value="0">
                <span class="time-display">00:00 / 00:00</span>
                <button class="play">Play</button>
                <button class="reset">Reset</button>
            </div>
        </div>
        <div class="scroll-item pics">
            <img src="images/IMG_9330.jpg" alt="calgary public library" width="300">
            <!-- this is my image -->
        </div>
    </div>

    <hr>

    <p>Control the background audio here:</p>
    <div id="audio-div">
        <audio id="audio" autoplay controls loop src="audio/bird-park-ambience.mp3" type="audio/mp3">
            <!-- source for this audio is in sources.md -->
            This broswer does not support this audio :(
        </audio>
    </div>
    

    <script src="script.js"></script>
</body>
</html>
